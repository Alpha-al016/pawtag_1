<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pets | Paw Tag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/mypets.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                🐾 Paw Tag
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>
                <a class="active" href="mypets.html">
                    <i class="bi bi-heart"></i>
                    My Pets
                </a>
                <a href="nfctag.html">
                    <i class="bi bi-phone"></i>
                    NFC Tag
                </a>
                <a href="scanhistory.html">
                    <i class="bi bi-upc-scan"></i>
                    Scan History
                </a>
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    Profile
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </div>
        </aside>
        <div class="main-content">
            <header class="topbar">
                <div class="logo">
                    🐾 Paw Tag
                </div>
                <div class="user-menu">
                    <i class="bi bi-bell"></i>
                    <div class="avatar" id="avatar">
                        R
                    </div>
                </div>
            </header>
            <main class="mypets">
                <div class="page-title">
                    <h2>My Pets</h2>
                    <a href="addpet.html" class="add-pet-btn">
                        <i class="bi bi-plus-lg"></i>
                        Tambah Hewan
                    </a>
                </div>
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="🔍 Cari hewan..."
                        >
                </div>
                <div class="filter-wrapper">
                    <button class="filter-btn active" data-filter="all">
                        🐾 Semua
                    </button>
                    <button class="filter-btn" data-filter="Anjing">
                        🐶 Anjing
                    </button>
                    <button class="filter-btn" data-filter="Kucing">
                        🐱 Kucing
                    </button>
                    <button class="filter-btn" data-filter="Kelinci">
                        🐰 Kelinci
                    </button>
                    <button class="filter-btn" data-filter="Burung">
                        🐦 Burung
                    </button>
                    <button class="filter-btn" data-filter="Lainnya">
                        🐾 Lainnya
                    </button>
                </div>
                <div class="sort-wrapper">
                    <label for="sortSelect">Urutkan:</label>
                    <select id="sortSelect">
                        <option value="newest">Terbaru</option>
                        <option value="oldest">Terlama</option>
                        <option value="az">Nama (A-Z)</option>
                        <option value="za">Nama (Z-A)</option>
                    </select>
                </div>
                <section class="pet-grid" id="petGrid">
                    
                </section>
            </main>
        </div>
    </div>
    <script src="../assets/js/session.js"></script>
    <script src="../assets/js/mypets.js"></script>
</body>
</html>
