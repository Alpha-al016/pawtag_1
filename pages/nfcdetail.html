<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Detail | Paw Tag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/nfcdetail.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                🐾 Paw Tag
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>
                <a href="mypets.html">
                    <i class="bi bi-heart"></i>
                    My Pets
                </a>
                <a class="active" href="nfctag.html">
                    <i class="bi bi-phone"></i>
                    NFC Tag
                </a>
                <a href="scanhistory.html">
                    <i class="bi bi-upc-scan"></i>
                    Scan History
                </a>
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    Profile
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </div>
        </aside>
        <div class="main-content">
            <header class="topbar">
                <div class="logo">
                    🐾 Paw Tag
                </div>
                <div class="user-menu">
                    <i class="bi bi-bell"></i>
                    <div class="avatar" id="avatar">
                        R
                    </div>
                </div>
            </header>
            <main class="detail-page">
                <div class="page-header">
                    <h1>Detail NFC</h1>
                    <p>
                        Informasi NFC Tag yang terhubung.
                    </p>
                </div>
                <div class="detail-card">
                    <div class="info-card">
                        <h3>Public Link</h3>
                        <div class="link-group">
                            <input
                                type="text"
                                id="publicLink"
                                readonly>
                            <button
                                id="copyBtn"
                                class="copy-btn">
                                <i class="bi bi-copy"></i>
                                Copy
                            </button>
                        </div>
                    </div>
                    <div class="detail-group">
                        <label>Nama Hewan</label>
                        <input
                            id="petName"
                            readonly
                        >
                    </div>
                    <div class="detail-group">
                        <label>Kode NFC</label>
                        <input
                            id="nfcCode"
                            readonly
                        >
                    </div>
                    <div class="detail-group">
                        <label>Status</label>
                        <input
                            id="status"
                            readonly
                        >
                    </div>
                    <div class="button-group">
                        <button
                            id="changeBtn"
                            class="primary-btn">
                            Ganti Kode
                        </button>
                        <button
                            id="unlinkBtn"
                            class="danger-btn">
                            Putuskan NFC
                        </button>
                        <a
                            href="nfctag.html"
                            class="secondary-btn">
                            Kembali
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/nfcdetail.js"></script>
</html>
