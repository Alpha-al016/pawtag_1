<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Paw Tag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/profile.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                🐾 Paw Tag
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>
                <a href="mypets.html">
                    <i class="bi bi-heart"></i>
                    My Pets
                </a>
                <a href="nfctag.html">
                    <i class="bi bi-phone"></i>
                    NFC Tag
                </a>
                <a href="scanhistory.html">
                    <i class="bi bi-upc-scan"></i>
                    Scan History
                </a>
                <a class="active" href="profile.html">
                    <i class="bi bi-person"></i>
                    Profile
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </div>
        </aside>
        <div class="main-content">
            <header class="topbar">
                <div class="logo">
                    🐾 Paw Tag
                </div>
                <div class="user-menu">
                    <i class="bi bi-bell"></i>
                    <div class="avatar" id="avatar">
                        R
                    </div>
                </div>
            </header>
            <main class="profile-page">
                <h1>Profile</h1>
                <div class="profile-card">
                    <div class="profile-avatar">
                        <div class="avatar-circle" id="profileAvatar">
                            R
                        </div>
                        <h2 id="profileName">Belum Diisi</h2>
                        <p>Pet Owner</p>
                    </div>
                    <div class="profile-info">
                        <div class="info-item">
                            <label>Email</label>
                            <span id="profileEmail">Belum Diisi</span>
                        </div>
                        <div class="info-item">
                            <label>Nomor HP</label>
                            <span id="profilePhone">Belum Diisi</span>
                        </div>
                        <div class="info-item">
                            <label>Alamat</label>
                            <span id="profileAddress">Belum Diisi</span>
                        </div>
                    </div>
                    <a href="editprofile.html" class="edit-btn">
                        Edit Profile
                    </a>
                </div>
            </main>
        </div>
    </div>
    <script src="../assets/js/session.js"></script>
    <script src="../assets/js/profile.js"></script>
</body>
</html>
