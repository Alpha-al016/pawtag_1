<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paw Tag | Pet Information</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../assets/css/publicpet.css">
    </head>
    <body>
        <div class="container">
            <div class="pet-card">
                <img
                    id="petImage"
                    src="../assets/img/golden hour cat nap 🥺.jpg"
                    alt="Pet">
                <h1 id="petName">
                    Nama Hewan
                </h1>
                <p id="petBreed">
                    Breed
                </p>
                <span
                    id="petStatus
                    class="status">
                    NFC Aktif
                </span>
            </div>
            <div class="info-card">
                <h2>
                    Informasi Pemilik
                </h2>
                <p>
                    <i class="bi bi-person"></i>
                    <span id="ownerName"></span>
                </p>
                <p>
                    <i class="bi bi-telephone"></i>
                    <span id="ownerPhone"></span>
                </p>
                <p>
                    <i class="bi bi-geo-alt"></i>
                    <span id="ownerAddress"></span>
                </p>
            </div>
            <div class="info-card">
                <h2>
                    Catatan
                </h2>
                <p id="petNote">
                    -
                </p>
            </div>
            <div class="button-group">
                <a
                    id="callBtn"
                    class="primary-btn">
                    <i class="bi bi-telephone-fill"></i>
                    Hubungi Pemilik
                </a>
                <a
                    id="waBtn"
                    class="secondary-btn">
                    <i class="bi bi-whatsapp"></i>
                    WhatsApp
                </a>
            </div>
        </div>
    </body>
    <script src="../assets/js/publicpet.js"></script>
</html>
