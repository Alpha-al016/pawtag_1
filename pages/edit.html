<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Data PawTag</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fa;
            color: #222;
        }

        .container {

            width: 100%;
            max-width: 650px;

            margin: 40px auto;
            padding: 20px;
        }

        .card {

            background: white;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);
        }

        h1 {

            margin-top: 0;
            margin-bottom: 10px;

            font-size: 28px;
        }

        .description {

            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 7px;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px 14px;

            border:
                1px solid #d6dbe1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {

            border-color: #777;
        }

        textarea {

            min-height: 100px;

            resize: vertical;
        }

        button {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 14px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }

        .message {

            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 8px;

            display: none;
        }

        .message.error {

            display: block;

            background: #ffe5e5;

            color: #a00000;
        }

        .message.success {

            display: block;

            background: #e5f7e9;

            color: #176b2c;
        }

    </style>

</head>


<body>

    <main class="container">

        <section class="card">

            <h1>
                Edit Data Hewan
            </h1>

            <p class="description">
                Perbarui informasi hewan dan
                kontak pemilik PawTag Anda.
            </p>


            <!-- ERROR / SUCCESS MESSAGE -->

            <div
                id="errorMessage"
                class="message">
            </div>


            <!-- FORM -->

            <form id="editForm">

                <!-- FOTO HEWAN -->

                <div class="form-group">

                    <label for="petPhoto">
                        Foto Hewan
                    </label>

                    <input
                        type="file"
                        id="petPhoto"
                        accept="image/*"
                    >

                    <img
                        id="petPhotoPreview"
                        src=""
                        alt="Preview Foto Hewan"
                        style="
                            display: none;
                            width: 100%;
                            max-width: 300px;
                            margin-top: 12px;
                            border-radius: 10px;
                        "
                    >

                </div>

                <!-- NAMA PEMILIK -->

                <div class="form-group">
                    <label for="ownerName">
                        Nama Pemilik
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                    >
                </div>

                <!-- NAMA HEWAN -->

                <div class="form-group">

                    <label for="petName">
                        Nama Hewan
                    </label>

                    <input
                        type="text"
                        id="petName"
                        required
                    >

                </div>


                <!-- SPECIES -->

                <div class="form-group">

                    <label for="species">
                        Jenis Hewan
                    </label>

                    <input
                        type="text"
                        id="species"
                        required
                    >

                </div>


                <!-- BREED -->

                <div class="form-group">

                    <label for="breed">
                        Ras / Breed
                    </label>

                    <input
                        type="text"
                        id="breed"
                    >

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label for="contactNumber">
                        Nomor Telepon
                    </label>

                    <input
                        type="text"
                        id="contactNumber"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Alamat
                    </label>

                    <textarea
                        id="address"
                    ></textarea>

                </div>


                <!-- NOTES -->

                <div class="form-group">

                    <label for="notes">
                        Catatan
                    </label>

                    <textarea
                        id="notes"
                    ></textarea>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="submitBtn">

                    Simpan Perubahan

                </button>


            </form>

        </section>

    </main>


    <!-- EDIT JS -->

    <script src="../assets/js/edit.js"></script>

</body>

</html>
