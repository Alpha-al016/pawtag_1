<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Hewan | Paw Tag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/petdetail.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                🐾 Paw Tag
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>
                <a class="active" href="mypets.html">
                    <i class="bi bi-heart"></i>
                    My Pets
                </a>
                <a href="nfctag.html">
                    <i class="bi bi-phone"></i>
                    NFC Tag
                </a>
                <a href="scanhistory.html">
                    <i class="bi bi-upc-scan"></i>
                    Scan History
                </a>
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    Profile
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </div>
        </aside>
        <div class="main-content">
            <header class="topbar">
                <div class="logo">
                    🐾 Paw Tag
                </div>
                <div class="user-menu">
                    <i class="bi bi-bell"></i>
                    <div class="avatar" id="avatar">
                        R
                    </div>
                </div>
            </header>
            <main class="pet-detail">
                <section class="page-title">
                    <h1>Detail Hewan</h1>
                    <p>
                        Informasi lengkap hewan peliharaan.
                    </p>
                </section>
                <section class="profile-card">
                    <a href="mypets.html" class="back-btn">
                        <i class="bi bi-arrow-left"></i>
                        Kembali
                    </a>
                    <div class="profile-image">
                        <img src="../assets/img/golden hour cat nap 🥺.jpg" id="detailImage">
                    </div>
                    <h2 id="detailName">
                        
                    </h2>
                    <p id="detailBreed">
                        
                    </p>
                    <span
                        class="status inactive"
                        id="detailStatus">
                        
                    </span>
                </section>
                <section class="info-card">
                    <h2>📋 Informasi Hewan</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span>Nama</span>
                            <strong id="infoName"></strong>
                        </div>
                        <div class="info-item">
                            <span>Jenis</span>
                            <strong id="infoType"></strong>
                        </div>
                        <div class="info-item">
                            <span>Ras</span>
                            <strong id="infoBreed"></strong>
                        </div>
                        <div class="info-item">
                            <span>Tanggal Lahir</span>
                            <strong id="infoBirth"></strong>
                        </div>
                        <div class="info-item">
                            <span>Jenis Kelamin</span>
                            <strong id="infoGender"></strong>
                        </div>
                        <div class="info-item">
                            <span>Warna</span>
                            <strong id="infoColor"></strong>
                        </div>
                        <div class="info-item">
                            <span>Berat</span>
                            <strong id="infoWeight"></strong>
                        </div>
                    </div>
                </section>
                <section class="owner-card">
                    <h2>👤 Informasi Pemilik</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span>Nama Pemilik</span>
                            <strong id="ownerName">
                                
                            </strong>
                        </div>
                        <div class="info-item">
                            <span>Nomor HP</span>
                            <strong id="ownerPhone">
                                
                            </strong>
                        </div>
                        <div class="info-item">
                            <span>Alamat</span>
                            <strong id="ownerAddress">
                                
                            </strong>
                        </div>
                    </div>
                </section>
                <section class="note-card">
                    <h2>📝 Catatan</h2>
                    <p id="petNote">
                        
                    </p>
                </section>
            </main>
        </div>
    </div>
</body>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/petdetail.js"></script>
</html>
